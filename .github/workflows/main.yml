name: Token Permission Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Verify Least Privilege
    runs-on: ubuntu-latest

    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Test repository read access
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Testing repository read access..."

          REPO_INFO=$(gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${{ github.repository }}")

          echo "Repository read access successful."
          echo "$REPO_INFO" | jq '{name, full_name, private, default_branch}'

      - name: Test secret access
        env:
          LAB_TEST_SECRET: ${{ secrets.LAB_TEST_SECRET }}
        run: |
          echo "Testing secret access..."

          if [ -n "$LAB_TEST_SECRET" ]; then
            echo "Secret is available to the workflow."
          else
            echo "Secret is NOT available to the workflow."
            exit 1
          fi

      - name: Complete test
        run: |
          echo "===================================="
          echo "Least-privilege test passed."
          echo "Repository read: PASS"
          echo "Secret access: PASS"
          echo "No unnecessary write permissions granted."
          echo "===================================="
