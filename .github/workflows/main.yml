name: Environment Secret Test

on:
  workflow_dispatch:

jobs:
  test:
    name: Verify Environment Secret
    runs-on: ubuntu-latest

    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Test environment secret
        env:
          PRODUCTION_TEST_SECRET: ${{ secrets.PRODUCTION_TEST_SECRET }}
        run: |
          echo "Testing production environment secret..."

          if [ -n "$PRODUCTION_TEST_SECRET" ]; then
            echo "Production environment secret is available."
          else
            echo "Production environment secret is NOT available."
            exit 1
          fi

      - name: Complete test
        run: |
          echo "===================================="
          echo "Environment secret test passed."
          echo "Production environment is authorized."
          echo "Environment secret is available."
          echo "===================================="
